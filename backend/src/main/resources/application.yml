server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: campus-auction

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/campus_auction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 10
    connect-retries-interval: 5s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: 1800000
  refresh-expiration: 604800000

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/images/}
  allowed-types: jpg,jpeg,png,gif,webp
  max-size: 5242880

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ca: INFO
    org.springframework.security: WARN
